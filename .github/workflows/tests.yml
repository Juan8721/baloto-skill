name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
        exclude:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python modules
        run: python -m py_compile skills/baloto/scripts/baloto.py skills/baloto/scripts/carrito_helper.py scripts/install.py tests/test_baloto.py
      - name: Run test suite
        run: python -W error::EncodingWarning -m unittest discover -s tests -v
      - name: Verify clean repository state
        run: git status --porcelain && test -z "$(git status --porcelain)"
        shell: bash
