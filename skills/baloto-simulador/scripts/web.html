<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de sorteos · Simulación</title>
<style>
:root{color-scheme:light;--ink:#172537;--muted:#526473;--paper:#f5f4ef;--line:#dcded8;--accent:#145b47;--lime:#d5ef89}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}
header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
a{color:var(--accent);text-underline-offset:4px}.brand{color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:-.6px}.badge{font-size:12px;letter-spacing:1px;text-transform:uppercase;background:var(--lime);color:#254533;border-radius:30px;padding:7px 12px;font-weight:700}
main{max-width:1100px;margin:42px auto;padding:0 24px}h1{font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-1.8px;margin:12px 0 18px;max-width:800px}h2{font-size:22px;letter-spacing:-.5px;margin:0 0 18px}h3{margin:0 0 12px;font-size:17px}p{margin:8px 0 16px}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.intro{max-width:720px;margin-bottom:32px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.dark .muted{color:#c8d3d6}.stack{display:grid;gap:20px;align-content:start}
label{display:block;font-size:14px;font-weight:650;margin:0 0 6px}input,textarea{width:100%;border:1px solid #aeb9bc;border-radius:8px;padding:11px;font:inherit;background:#fafbf8;color:var(--ink)}input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #8cb7a0;outline-offset:3px}textarea{min-height:150px;font-family:ui-monospace,monospace;resize:vertical}.field{margin-bottom:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.help{font-size:12px;color:var(--muted);margin-top:6px}
button{border:0;border-radius:9px;background:var(--accent);color:white;padding:12px 18px;font:650 14px/1.4 system-ui;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.6;cursor:wait}.secondary{background:#e8eee9;color:#183e31}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.wide{width:100%}.step{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid #3b4857}.step:last-child{border:0}.step b{color:var(--lime);font-size:14px}.step p{margin:0;font-size:14px}.step strong{display:block;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.metric strong{font-size:30px;letter-spacing:-1px}.metric small{font-size:12px;margin-left:5px;color:var(--muted)}.status{display:inline-flex;border-radius:20px;background:#edf0e9;font-size:12px;font-weight:700;padding:5px 10px}.note{border-left:3px solid var(--accent);padding:8px 16px;background:#e9eee3;margin:20px 0}.linkbox{overflow-wrap:anywhere;font-size:14px;padding:14px;background:#f0f3ed;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:650}th,td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th:first-child,td:first-child{padding-left:0}.tablewrap{overflow-x:auto}.balls{white-space:nowrap;font-family:ui-monospace,monospace;font-weight:650}.balls em{font-style:normal;color:var(--accent);margin-left:6px}.list{list-style:none;padding:0;margin:0}.list li{padding:12px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}.list a{font-weight:650}.list .status{float:right}.small{font-size:13px}details{margin-top:14px}summary{cursor:pointer;font-size:14px;font-weight:650}.error{border:1px solid #a52e28;background:#fff1ed;color:#84271f;padding:13px 18px;border-radius:8px;margin-bottom:20px}footer{max-width:1100px;margin:40px auto;padding:24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:750px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}header{padding:16px 20px}.badge{font-size:10px}main{margin-top:28px;padding:0 20px}.panel{padding:20px}.row{grid-template-columns:1fr}h1{letter-spacing:-1px}.metric{padding:15px}.metric strong{font-size:25px}}
</style>
</head>
<body>
<header><a class="brand" href="/">◌ Laboratorio de sorteos</a><span class="badge">Demo · sin dinero real</span></header>
<main><div id="error" role="alert" hidden></div><div id="app"><p>Cargando la demostración…</p></div></main>
<footer>Proyecto educativo independiente. Sin afiliación con Baloto. Sesión local de demostración, créditos ficticios y resultados sintéticos. Los datos permanecen en este equipo.</footer>
<script nonce="__TOKEN__">
const TOKEN='__TOKEN__';
const app=document.querySelector('#app'),error=document.querySelector('#error');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v).toLocaleString('es-CO');
const date=v=>new Date(v).toLocaleString('es-CO',{timeZone:'UTC',dateStyle:'medium',timeStyle:'short'})+' UTC';
const status=s=>({draft:'Carrito en borrador',confirmed:'Simulación activa',complete:'Simulación completada'}[s]);
const balls=l=>`<span class="balls">${l.numbers.map(v=>String(v).padStart(2,'0')).join(' · ')}<em>+ ${String(l.extra).padStart(2,'0')}</em></span>`;
function showError(e){error.hidden=false;error.className='error';error.textContent=e.message||String(e);}
async function api(path,body){const opts=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Demo-Token':TOKEN},body:JSON.stringify(body)};const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo completar la operación.');return j;}
function navigate(url){history.pushState({},'',url);render().catch(showError);}
async function home(){
 const campaigns=await api('/api/campaigns');
 app.innerHTML=`<div class="intro"><div class="eyebrow">Una skill, de principio a fin</div><h1>Prueba el flujo.<br>Entiende la automatización.</h1><p class="muted">Introduce números de ejemplo, prepara un carrito ficticio y sigue su resultado. Tú controlas el límite de créditos y el reloj.</p></div>
 <div class="grid"><section class="panel"><h2>01 / Configura tu experimento</h2><form id="setup">
 <div class="field"><label for="label">Nombre de la prueba</label><input id="label" name="label" value="Mi primera simulación" maxlength="80" required></div>
 <div class="field"><label for="lines">Tus combinaciones de ejemplo</label><textarea id="lines" name="lines" required spellcheck="false" aria-describedby="line-help">01 02 03 04 05 | 06
07 08 09 10 11 | 12</textarea><div id="line-help" class="help">Datos sintéticos de muestra. Una línea: cinco números distintos (1–43) | adicional (1–16). Hasta 500 líneas.</div></div>
 <div class="field"><label for="budget">Límite de créditos ficticios</label><input id="budget" name="budget" type="number" min="1" max="1000000" value="20" required><div class="help">Una línea cuesta un crédito por sorteo. Estos créditos no tienen valor monetario.</div></div>
 <div class="row"><div class="field"><label for="draw_count">Cantidad de sorteos simulados</label><input id="draw_count" name="draw_count" type="number" min="1" max="100" value="3" required></div><div class="field"><label for="interval_days">Días entre sorteos</label><input id="interval_days" name="interval_days" type="number" min="1" max="30" value="1" required></div></div>
 <button class="wide" type="submit">Preparar carrito demo →</button></form></section>
 <aside class="stack"><section class="panel dark"><h2>Cómo funciona la prueba</h2><div class="step"><b>01</b><p><strong>Recibe tus respuestas</strong>Valida números y créditos, sin cambiar tu configuración.</p></div><div class="step"><b>02</b><p><strong>Prepara el carrito</strong>Lo deja en borrador hasta tu confirmación ficticia.</p></div><div class="step"><b>03</b><p><strong>Comprueba al día siguiente</strong>Genera resultados sintéticos y calcula créditos de prueba.</p></div><div class="step"><b>04</b><p><strong>Conserva tu seguimiento</strong>Una URL local, con resultados y balance del experimento.</p></div></section>
 <section class="panel"><h3>Experimentos guardados</h3>${campaigns.length?'<ul class="list">'+campaigns.map(c=>`<li><a href="${c.url}">${esc(c.label)}</a><br><span class="small muted">${status(c.status)}</span></li>`).join('')+'</ul>':'<p class="muted small">Tu primer experimento aparecerá aquí.</p>'}</section></aside></div>`;
 document.querySelector('#setup').addEventListener('submit',async event=>{event.preventDefault();error.hidden=true;const form=event.target,button=form.querySelector('button');button.disabled=true;try{const f=new FormData(form);const c=await api('/api/campaigns',{label:f.get('label'),lines:f.get('lines'),budget:Number(f.get('budget')),draw_count:Number(f.get('draw_count')),interval_days:Number(f.get('interval_days'))});navigate(c.url);}catch(e){showError(e);}finally{button.disabled=false;}});
}
async function tracking(id){
 const c=await api('/api/campaigns/'+id);
 const finished=c.draws.filter(d=>d.result).length;
 app.innerHTML=`<a href="/" class="small">← Todos los experimentos</a><div class="intro"><div class="eyebrow" style="margin-top:24px">Tu seguimiento local</div><h1>${esc(c.label)}</h1><span class="status">${status(c.status)}</span><p class="muted">${c.lines.length} líneas × ${c.draws.length} sorteos · ${finished} resultados disponibles</p></div>
 <div class="cards"><div class="metric"><span>Límite inicial</span><strong>${n(c.budget)}</strong><small>créditos</small></div><div class="metric"><span>${c.status==='draft'?'Costo previsto':'Costo simulado'}</span><strong>${n(c.cost)}</strong><small>créditos</small></div><div class="metric"><span>Créditos devueltos</span><strong>${n(c.returned)}</strong></div><div class="metric"><span>Saldo del experimento</span><strong>${n(c.remaining)}</strong></div></div>
 <section class="panel"><div class="grid"><div><h2>${c.status==='draft'?'02 / Carrito demo listo':'03 / Sigue la simulación'}</h2><p class="muted">${c.status==='draft'?'El carrito está preparado. Confirmarlo solo inicia este experimento local. No se realiza ningún pago.':'El trabajador comprueba cada sorteo un día después de su fecha. Puedes adelantar el reloj para ver el proceso ahora.'}</p><p class="small">Reloj del experimento: <strong>${date(c.virtual_now)}</strong><br>Adelanto aplicado: ${c.offset_days} días · Balance simulado: ${n(c.balance)} créditos</p><div class="buttons">${c.status==='draft'?'<button id="confirm">Confirmar simulación</button>':''}<button id="advance" class="secondary">Avanzar un día →</button></div></div>
 <div><h3>Enlace de seguimiento</h3><div class="linkbox"><a href="${c.url}">${esc(location.origin+c.url)}</a></div><p class="help">Disponible en este equipo mientras el servidor esté encendido. El estado se conserva al reiniciar.</p><details><summary>Ver ${c.lines.length} líneas recibidas</summary><ol>${c.lines.map(l=>'<li>'+balls(l)+'</li>').join('')}</ol></details></div></div></section>
 <div class="note small">Todos los resultados y créditos son ficticios. El primer sorteo ocurre un día después de crear el carrito; su comprobación, un día después. Un carrito en borrador no produce resultados.</div>
 <section class="panel"><h2>Sorteos del experimento</h2><div class="tablewrap"><table><thead><tr><th>Sorteo</th><th>Fecha del sorteo</th><th>Comprobación desde</th><th>Resultado sintético</th><th>Créditos</th></tr></thead><tbody>${c.draws.map(d=>`<tr><td>#${d.index}</td><td>${date(d.draw_at)}</td><td>${date(d.check_at)}</td><td>${d.result?balls(d.result):'<span class="muted">Pendiente</span>'}</td><td>${d.result?n(d.result.credits):'—'}</td></tr>`).join('')}</tbody></table></div>
 ${c.draws.filter(d=>d.result).map(d=>`<details><summary>Detalle de aciertos · sorteo #${d.index}</summary><div class="tablewrap"><table><thead><tr><th>Línea</th><th>Aciertos</th><th>Adicional</th><th>Créditos</th></tr></thead><tbody>${d.result.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${l.hits}/5</td><td>${l.extra_match?'Sí':'No'}</td><td>${l.credits}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}</section>
 <details class="panel" style="margin-top:24px"><summary>Tabla inventada de créditos de la demo</summary><p class="small muted">Esta tabla sirve para probar el cálculo. No corresponde a premios oficiales.</p><p class="small">5 + adicional: 1.000 · 5: 100 · 4 + adicional: 50 · 4: 20 · 3 + adicional: 10 · 3: 5 · 2 + adicional: 3 · 0 o 1 + adicional: 1. Los demás casos devuelven cero créditos.</p></details>`;
 for(const action of ['confirm','advance']){const button=document.getElementById(action);if(button)button.onclick=async()=>{button.disabled=true;error.hidden=true;try{await api('/api/campaigns/'+id+'/'+action,{});await tracking(id);}catch(e){showError(e);button.disabled=false;}};}
}
async function render(){error.hidden=true;const m=location.pathname.match(/^\/seguimiento\/([a-f0-9]{32})$/);if(m)await tracking(m[1]);else await home();}
window.addEventListener('popstate',()=>render().catch(showError));
document.addEventListener('click',event=>{const a=event.target.closest('a');if(a&&a.origin===location.origin&&!event.ctrlKey&&!event.metaKey){event.preventDefault();navigate(a.pathname);}});
setInterval(()=>{const m=location.pathname.match(/^\/seguimiento\/([a-f0-9]{32})$/);if(m&&!document.querySelector('button:disabled')&&!document.querySelector('details[open]'))tracking(m[1]).catch(showError);},10000);
render().catch(showError);
</script>
</body>
</html>
